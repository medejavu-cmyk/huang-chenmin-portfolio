<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Olivia · 黄晨敏的个人数字世界，关于人工智能、视觉创作与运动文化。">
  <meta name="theme-color" content="#050b13">
  <title>Olivia · Digital World</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="landing-page">
  <main class="landing" id="top">
    <div class="landing-background" aria-hidden="true"></div>
    <div class="landing-shade" aria-hidden="true"></div>

    <p class="landing-edition">OLIVIA'S DIGITAL WORLD <span>© 2026</span></p>
    <p class="landing-coordinate">AI · VISUAL · MOVEMENT</p>

    <section class="landing-center" aria-labelledby="landing-title">
      <a class="avatar-gateway" href="home.html" data-enter aria-label="点击头像进入 Olivia 的主页">
        <span class="avatar-glass" aria-hidden="true"></span>
        <img src="assets/olivia-avatar.jpg" alt="Olivia 的蓝色水彩头像">
        <span class="avatar-ring" aria-hidden="true"></span>
      </a>

      <div class="landing-title-wrap">
        <p class="landing-kicker">HUANG CHENMIN</p>
        <h1 id="landing-title">OLIVIA</h1>
        <p class="landing-intro">A creator between code, image and movement.</p>
      </div>

      <a class="enter-link" href="home.html" data-enter>
        <span>ENTER</span>
        <i aria-hidden="true"></i>
      </a>
    </section>

    <p class="landing-hint">CLICK THE PORTRAIT TO ENTER</p>
  </main>
</body>
</html>
